# Vérifie puis publie le site sur GitHub Pages :
#  - à chaque push sur main ;
#  - chaque jour (données Steam à jour) ;
#  - à la demande, depuis l'onglet Actions.
# Le déploiement n'a lieu que si toutes les vérifications réussissent.
name: Vérifier et publier

on:
  push:
    branches: [main]
  schedule:
    # Chaque jour à 05:17 UTC (06:17 ou 07:17 à Lausanne). GitHub peut retarder
    # ces exécutions et les désactive après 60 jours sans activité sur le dépôt.
    - cron: "17 5 * * *"
  workflow_dispatch:

# Permissions minimales par défaut : lecture du dépôt uniquement
permissions:
  contents: read

# Un seul déploiement à la fois ; celui en cours n'est pas interrompu
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pas de télémétrie Astro dans GitHub Actions
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verifier:
    name: Vérifier et construire
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js (version de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances (package-lock.json)
        run: npm ci

      - name: Installer Chromium et Firefox pour les tests
        run: npx playwright install --with-deps chromium firefox

      # Données Steam : les dernières données valides sont reprises du cache,
      # puis mises à jour si possible. Un échec ne bloque jamais la publication.
      - name: Reprendre les dernières données Steam
        uses: actions/cache/restore@v6
        with:
          path: .steam
          key: steam-${{ github.run_id }}
          restore-keys: steam-

      - name: Mettre à jour les données Steam
        run: npm run steam:fetch
        env:
          # Seule étape qui reçoit la clé (secret du dépôt, masqué dans les journaux)
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Conserver les données Steam
        if: hashFiles('.steam/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .steam
          key: steam-${{ github.run_id }}

      - name: Contrôles, build, tests et vie privée
        run: npm run verify

      - name: Contrôle de mise en ligne
        run: npm run check:launch

      - name: Vérifier que la clé Steam n'apparaît nulle part
        run: npm run check:privacy
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  publier:
    name: Publier sur GitHub Pages
    needs: verifier
    # Uniquement depuis main, même en cas de lancement manuel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v5
